<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>## Exercise #3: Changing images </title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <select id="imageSelect">
    <option value="" disabled selected>Select</option>
    <option value="images/image1.png">Image 1</option>
    <option value="images/image2.png">Image 2</option>
    <option value="images/image3.png">Image 3</option>
  </select>

  <div id="image-container">
    <!-- Default "no image" placeholder -->
    <img id="displayImage" src="images/image.png" alt="No image selected" />
  </div>

  <script src="script.js"></script>
</body>
</html>
